<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>All Posts</title>
</head>

<body>
    <nav class="navbar bg-light">
        <div class="container-fluid justify-content-end">

            <form class="d-flex" action="/search" method="GET">

                <input class="form-control me-2 border border-success" type="search" name="q" placeholder="Search">

                <button class="btn btn-success" type="submit">
                    Search
                </button>

            </form>

        </div>
    </nav>

    <h1>All Posts</h1>

    {% for post in posts %}

    <div class="card m-3">
        <div class="card-body">
            <h3>{{ post.title }}</h3>
            <p>{{ post.content }}</p>
            <p><small>Author: {{ post.author }}</small></p>
            <small>{{ post.date_created.strftime('%d-%m-%Y') }}</small>

            <a href="/category/<category_name>">
            <p><span class="badge bg-success">
                    {{ post.category }}
                </span></p></a>
        </div>

        <a href="/post/{{ post.id }}">
            <button>Read More</button>
        </a>
        <br>
    </div>


    {% endfor %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
