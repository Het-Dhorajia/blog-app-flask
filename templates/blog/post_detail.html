<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Post Detail</title>
</head>

<body>

<div class="container mt-4">

    <a href="/dashboard">
        <button >Back</button>
    </a>

    <div class="card">
        <div class="card-body">

            <h1>{{ post.title }}</h1>

            <p class="text-muted">
                Author: {{ post.author }} |
                {{ post.date_created }}
            </p>

            <hr>

            <p>{{ post.content }}</p>

        </div>
    </div>

</div>

</body>
</html>
